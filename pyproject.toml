[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "raven-osint"
version = "0.1.0"
description = "Keyboard-first TUI for building LLM-assisted OSINT graphs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Raven OSINT" }]
dependencies = [
    "httpx>=0.28",
    "netext[textual]>=0.5,<0.6",
    "neo4j>=5.27",
    "olefile>=0.47",
    "platformdirs>=4.3",
    "pymongo>=4.10",
    "qdrant-client>=1.13",
    "pypdf>=6.0",
    "termaid[rich]>=0.8,<0.9",
    "textual>=3.0",
    "keyring>=25",
]

[project.scripts]
raven = "raven.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raven"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
